name: CloudVault CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-verify:
    name: Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Next.js Build
        run: npm run build
        env:
          AWS_REGION: ap-south-1
          AWS_ACCESS_KEY_ID: dummy_key_for_build
          AWS_SECRET_ACCESS_KEY: dummy_secret_for_build
          AWS_S3_BUCKET_NAME: tushardevx01
